name: memory-arcade

services:
  app:
    image: memory-arcade:local
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - content-data:/app/.data
    init: true
    restart: unless-stopped

volumes:
  content-data:
